<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#FCF7ED"/>
      <stop offset="75%" stop-color="#F0E4CD"/>
      <stop offset="100%" stop-color="#DFCCAB"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDEBB4"/>
      <stop offset="45%" stop-color="#EBC55F"/>
      <stop offset="100%" stop-color="#A5781F"/>
    </linearGradient>
    <linearGradient id="gold2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF3C9"/>
      <stop offset="50%" stop-color="#D9B14A"/>
      <stop offset="100%" stop-color="#8C651C"/>
    </linearGradient>
    <radialGradient id="champ" cx="40%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#F6DEA0"/>
      <stop offset="100%" stop-color="#AC7E26"/>
    </radialGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <g transform="translate(400 430)">
    <!-- band with open ends -->
    <circle r="210" fill="none" stroke="url(#gold2)" stroke-width="0"/>
    <path d="M -170 -123 A 210 210 0 1 1 170 -123 L 195 -55 A 210 210 0 0 0 -195 -55 Z" fill="url(#gold)"/>
    <path d="M -160 -110 A 196 196 0 1 1 160 -110 L 182 -52 A 196 196 0 0 0 -182 -52 Z" fill="url(#gold2)"/>
    <path d="M -170 -123 A 210 210 0 1 1 170 -123" fill="none" stroke="#FFF0BD" stroke-width="6"/>
    <!-- stone setting -->
    <g transform="translate(0 -150)">
      <path d="M -34 -18 L 0 -46 L 34 -18 L 34 18 L 0 46 L -34 18 Z" fill="none" stroke="url(#gold)" stroke-width="10"/>
      <circle r="30" fill="url(#champ)" stroke="#8C651C" stroke-width="4"/>
      <circle r="14" fill="#FFF3C9"/>
      <path d="M 0 226 A 210 210 0 0 0 -13 225" fill="none" stroke="url(#gold)" stroke-width="8"/>
    </g>
    <!-- facet highlights -->
    <path d="M -70 -232 L -30 -238" stroke="#FFF0BD" stroke-width="6" stroke-linecap="round"/>
    <path d="M 40 -240 L 80 -234" stroke="#FFF0BD" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>