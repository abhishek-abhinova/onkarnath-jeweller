<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#FCF7ED"/>
      <stop offset="75%" stop-color="#F0E4CD"/>
      <stop offset="100%" stop-color="#DFCCAB"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDEBB4"/>
      <stop offset="45%" stop-color="#EBC55F"/>
      <stop offset="100%" stop-color="#A5781F"/>
    </linearGradient>
    <linearGradient id="gold2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF3C9"/>
      <stop offset="50%" stop-color="#D9B14A"/>
      <stop offset="100%" stop-color="#8C651C"/>
    </linearGradient>
    <linearGradient id="diamond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#DCE6F2"/>
      <stop offset="100%" stop-color="#9FB6CE"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <g transform="translate(400 420)">
    <!-- band -->
    <path d="M -170 -123 A 210 210 0 1 1 170 -123 L 175 -55 A 210 210 0 0 0 -175 -55 Z" fill="url(#gold)"/>
    <path d="M -160 -110 A 196 196 0 1 1 160 -110 L 166 -52 A 196 196 0 0 0 -166 -52 Z" fill="url(#gold2)"/>
    <!-- prongs + diamond -->
