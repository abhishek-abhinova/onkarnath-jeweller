      <path d="M -14 -12 L -30 -16 L -24 -2 L -10 -6 Z" fill="#FFFFFF" opacity="0.85"/>
      <g stroke="url(#gold)" stroke-width="7" stroke-linecap="round">
        <line x1="-40" y1="-8" x2="-56" y2="18"/>
        <line x1="40" y1="-8" x2="56" y2="18"/>
        <line x1="-30" y1="28" x2="-40" y2="48"/>
        <line x1="30" y1="28" x2="40" y2="48"/>
      </g>
    </g>
    <!-- sparkles -->
    <g fill="#FFFFFF">
      <path d="M 120 -250 l 6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6 Z"/>
      <path d="M -130 -180 l 4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 Z"/>
      <path d="M 160 -120 l 4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4 Z"/>
