<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#FCF7ED"/>
      <stop offset="75%" stop-color="#F0E4CD"/>
      <stop offset="100%" stop-color="#DFCCAB"/>
    </radialGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#CDD5DD"/>
      <stop offset="100%" stop-color="#8A969F"/>
    </linearGradient>
    <linearGradient id="silver2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#B7C1CA"/>
      <stop offset="100%" stop-color="#78848D"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <g transform="translate(400 430)">
    <!-- anklet band -->
    <path d="M -300 0 C -300 -230 300 -230 300 0" fill="none" stroke="url(#silver)" stroke-width="34"/>
    <path d="M -300 0 C -300 -230 300 -230 300 0" fill="none" stroke="url(#silver2)" stroke-width="22"/>
    <path d="M -300 0 C -300 -230 300 -230 300 0" fill="none" stroke="#FFFFFF" stroke-width="5" opacity="0.8"/>
    <!-- buti patterning -->
    <g fill="none" stroke="#E6EBEF" stroke-width="5" opacity="0.9">
      <path d="M -240 -110 C -220 -150 -190 -180 -150 -196"/>
      <path d="M -100 -216 C -60 -232 -20 -236 0 -236 C 20 -236 60 -232 100 -216"/>
      <path d="M 150 -196 C 190 -180 220 -150 240 -110"/>
    </g>
    <!-- little bells -->
    <g>
      <g transform="translate(-246 -88)">
        <path d="M -16 -12 C -22 4 -20 24 -8 32 L 8 32 C 20 24 22 4 16 -12 Z" fill="url(#silver)"/>
        <circle cx="0" cy="32" r="7" fill="url(#silver2)"/>
        <circle cx="0" cy="-12" r="5" fill="url(#silver2)"/>
      </g>
      <g transform="translate(246 -88) scale(-1 1)">
        <path d="M -16 -12 C -22 4 -20 24 -8 32 L 8 32 C 20 24 22 4 16 -12 Z" fill="url(#silver)"/>
        <circle cx="0" cy="32" r="7" fill="url(#silver2)"/>
        <circle cx="0" cy="-12" r="5" fill="url(#silver2)"/>
      </g>
      <g transform="translate(0 -236)">
        <path d="M -16 -12 C -22 4 -20 24 -8 32 L 8 32 C 20 24 22 4 16 -12 Z" fill="url(#silver)"/>
        <circle cx="0" cy="32" r="7" fill="url(#silver2)"/>
        <circle cx="0" cy="-12" r="5" fill="url(#silver2)"/>
      </g>
    </g>
  </g>
</svg>