  <!-- bangle 2 -->
  <g transform="translate(430 430)">
    <path d="M -300 0 C -300 -220 300 -220 300 0" fill="none" stroke="url(#gold)" stroke-width="40"/>
    <path d="M -300 0 C -300 -220 300 -220 300 0" fill="none" stroke="url(#gold2)" stroke-width="28"/>
