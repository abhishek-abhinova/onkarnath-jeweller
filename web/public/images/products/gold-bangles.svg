  <rect width="800" height="800" fill="url(#bg)"/>
  <!-- bangle 1 -->
  <g transform="translate(400 400)">
    <path d="M -300 0 C -300 -220 300 -220 300 0" fill="none" stroke="url(#gold)" stroke-width="46"/>
    <path d="M -300 0 C -300 -220 300 -220 300 0" fill="none" stroke="url(#gold2)" stroke-width="34"/>
