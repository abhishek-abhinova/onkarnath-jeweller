<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#FCF7ED"/>
      <stop offset="75%" stop-color="#F0E4CD"/>
      <stop offset="100%" stop-color="#DFCCAB"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDEBB4"/>
      <stop offset="45%" stop-color="#EBC55F"/>
      <stop offset="100%" stop-color="#A5781F"/>
    </linearGradient>
    <linearGradient id="gold2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF3C9"/>
      <stop offset="50%" stop-color="#D9B14A"/>
      <stop offset="100%" stop-color="#8C651C"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <g transform="translate(400 470)">
    <!-- links ascending -->
    <g stroke="none">
      <circle cx="0" cy="-200" r="34" fill="none" stroke="url(#gold)" stroke-width="16"/>
      <circle cx="0" cy="-200" r="34" fill="none" stroke="url(#gold2)" stroke-width="8"/>
      <circle cx="0" cy="-200" r="34" fill="none" stroke="#FFF0BD" stroke-width="3"/>
      <circle cx="0" cy="-120" r="40" fill="none" stroke="url(#gold)" stroke-width="18"/>
      <circle cx="0" cy="-120" r="40" fill="none" stroke="url(#gold2)" stroke-width="9"/>
      <circle cx="0" cy="-120" r="40" fill="none" stroke="#FFF0BD" stroke-width="3"/>
      <circle cx="0" cy="-36" r="48" fill="none" stroke="url(#gold)" stroke-width="20"/>
      <circle cx="0" cy="-36" r="48" fill="none" stroke="url(#gold2)" stroke-width="10"/>
      <circle cx="0" cy="-36" r="48" fill="none" stroke="#FFF0BD" stroke-width="3"/>
      <circle cx="0" cy="52" r="56" fill="none" stroke="url(#gold)" stroke-width="22"/>
      <circle cx="0" cy="52" r="56" fill="none" stroke="url(#gold2)" stroke-width="11"/>
      <circle cx="0" cy="52" r="56" fill="none" stroke="#FFF0BD" stroke-width="3"/>
    </g>
    <!-- clasp -->
    <circle cx="0" cy="132" r="40" fill="url(#gold2)" stroke="url(#gold)" stroke-width="12"/>
    <path d="M -20 172 L 20 172 L 20 188 L -20 188 Z" fill="url(#gold)"/>
